appId: com.electron.app
productName: bella
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # occt-import-js (STEP preview) ships its own test fixtures/examples/build
  # tooling in the published package - only dist/ (the WASM binary + its JS
  # glue) is ever loaded at runtime, see stepParser.ts.
  - '!node_modules/occt-import-js/{test,examples,tools,CMakeLists.txt,start_server.bat}{,/**}'
asarUnpack:
  - resources/**
win:
  executableName: bella
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
# electron-builder's snap target defaults to publishing via the Snap Store
# (which needs the snapcraft CLI) regardless of the top-level `publish`
# config above. Route it through the same GitHub Releases flow as the
# other artifacts instead.
snap:
  publish:
    - github
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# electron-updater's GitHub provider reads updates straight from this
# repo's published Releases - no separate update-server infra. Releases
# are created as drafts so a human reviews before publishing. See ADR 0002
# and ADR 0003.
publish:
  provider: github
  owner: tanby-dynamics
  repo: bella
  releaseType: draft
